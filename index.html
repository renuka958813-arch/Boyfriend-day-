<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise For You 💗</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  background:linear-gradient(135deg,#ff4f81,#ff8fb3,#9b7ede);
}

.screen{
  display:none;
  width:100%;
  height:100vh;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  position:relative;
  overflow:auto;
}

.screen.active{
  display:flex;
  animation:fadeIn .7s ease;
}

.container{
  width:min(540px,95%);
  position:relative;
  z-index:5;
}

.card{
  padding:30px 22px;
  border-radius:30px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(15px);
  box-shadow:0 20px 60px rgba(70,0,50,.3);
}

h1{
  font-size:clamp(36px,10vw,60px);
  margin-bottom:18px;
  text-shadow:0 5px 20px rgba(70,0,50,.45);
}

h2{
  font-size:clamp(28px,8vw,43px);
  margin-bottom:15px;
}

p{
  font-size:18px;
  line-height:1.7;
}

button{
  border:none;
  border-radius:30px;
  padding:14px 24px;
  margin:10px 5px;
  background:white;
  color:#e83e72;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(70,0,40,.3);
  transition:.3s;
}

button:hover{
  transform:scale(1.07);
}

button:active{
  transform:scale(.94);
}

.big-heart{
  font-size:105px;
  animation:heartbeat 1.2s infinite;
  filter:drop-shadow(0 10px 20px rgba(80,0,50,.4));
}

.lock{
  font-size:80px;
  animation:shake 2s infinite;
}

.envelope{
  width:250px;
  height:165px;
  background:white;
  border-radius:12px;
  margin:30px auto;
  position:relative;
  cursor:pointer;
  box-shadow:0 15px 40px rgba(70,0,40,.35);
  animation:float 2.5s infinite;
}

.envelope:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  border-left:125px solid transparent;
  border-right:125px solid transparent;
  border-top:90px solid #ff8bad;
}

.envelope:after{
  content:"💗";
  position:absolute;
  left:104px;
  top:58px;
  font-size:42px;
}

.letter{
  display:none;
  margin-top:20px;
  animation:slideUp .7s ease;
}

.gift{
  width:155px;
  height:130px;
  margin:45px auto;
  background:#ff477d;
  border-radius:10px;
  position:relative;
  cursor:pointer;
  animation:bounce 1.5s infinite;
  box-shadow:0 20px 40px rgba(70,0,40,.35);
}

.gift:before{
  content:"";
  position:absolute;
  width:26px;
  height:130px;
  background:#ffd166;
  left:64px;
}

.gift:after{
  content:"";
  position:absolute;
  width:180px;
  height:35px;
  background:#ff6090;
  left:-12px;
  top:-25px;
  border-radius:8px;
  border-bottom:7px solid #ffd166;
}

.gift-message{
  display:none;
  animation:pop .6s ease;
}

.reasons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:25px 0;
}

.reason{
  min-height:125px;
  padding:18px;
  border-radius:22px;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.4s;
}

.reason:hover{
  transform:translateY(-6px) rotate(2deg);
}

.reason.open{
  background:rgba(255,255,255,.4);
  transform:scale(1.03);
}

.answer{
  display:none;
}

.reason.open .question{
  display:none;
}

.reason.open .answer{
  display:block;
}

.secret{
  font-size:85px;
  margin:30px;
  cursor:pointer;
  animation:glow 1.3s infinite alternate;
}

.secret-message{
  display:none;
  animation:pop .7s ease;
}

.final-message{
  max-height:50vh;
  overflow:auto;
  text-align:left;
  padding:22px;
  margin-top:20px;
  border-radius:22px;
